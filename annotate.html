<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Bank Editor</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --success: #10b981; --danger: #ef4444; --border: #334155; }
    * { box-sizing: border-box; font-family: arial, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 380px 1fr; height: 100vh; overflow: hidden; }
    
    .sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .question-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .q-item { padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: border-color 0.15s; }
    .q-item:hover, .q-item.active { border-color: var(--accent); }
    .q-item-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .q-item-text { direction: rtl; text-align: right; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .main { padding: 24px 36px; overflow-y: auto; height: 100vh; }
    .form-card { max-width: 760px; margin: 0 auto; background: var(--panel); padding: 24px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], textarea, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 15px; width: 100%; }
    textarea { resize: vertical; min-height: 80px; }
    .rtl-input { direction: rtl; text-align: right; }
    
    .options-list { display: flex; flex-direction: column; gap: 8px; }
    .option-row { display: flex; align-items: center; gap: 10px; }
    .option-row input[type="radio"] { width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; }
    
    button { background: var(--accent); color: white; border: none; padding: 9px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { opacity: 0.9; }
    button.secondary { background: var(--border); color: var(--text); }
    button.success { background: var(--success); }
    button.danger { background: var(--danger); }
    
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted); cursor: pointer; transition: all 0.2s ease; background: var(--bg); }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); color: var(--text); }
    .img-preview-box { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
    .img-preview { max-height: 180px; max-width: 300px; border-radius: 6px; border: 1px solid var(--border); display: none; object-fit: contain; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="toolbar">
        <button onclick="resetForm()">+ New Question</button>
        <button class="success" onclick="exportJSON()">Export JSON</button>
        <button class="secondary" onclick="document.getElementById('fileInput').click()">Import JSON</button>
        <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importJSON(event)">
      </div>
      <input type="text" id="searchFilter" placeholder="Filter by category or text..." oninput="renderList()">
      <div style="font-size: 12px; color: var(--muted);" id="countDisplay">0 questions in bank</div>
    </div>
    <div class="question-list" id="questionList"></div>
  </aside>

  <main class="main">
    <div class="form-card">
      <h2 id="formTitle" style="margin: 0;">Create Question</h2>
      
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="categoryInput" list="categorySuggestions" placeholder="e.g., Anatomy, Pharmacology...">
        <datalist id="categorySuggestions"></datalist>
      </div>

      <div class="form-group">
        <label>Question (Hebrew / RTL)</label>
        <textarea id="questionInput" class="rtl-input" placeholder="הכנס את השאלה כאן..."></textarea>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label>Answer Possibilities (Select the right answer)</label>
          <button type="button" class="secondary" onclick="addOptionRow()">+ Add Option</button>
        </div>
        <div class="options-list" id="optionsContainer"></div>
      </div>

      <div class="form-group">
        <label>Explanation (English / LTR)</label>
        <textarea id="explanationInput" placeholder="Explain why the answer is correct..."></textarea>
      </div>

      <div class="form-group">
        <label>Image (Optional)</label>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('imageInput').click()">
          Click to browse, Drag & Drop a file, or press <strong>Ctrl+V</strong> to paste a screenshot.
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        
        <div class="img-preview-box">
          <img id="imagePreview" class="img-preview">
          <button type="button" id="clearImgBtn" class="danger" style="display:none;" onclick="clearImage()">Remove Image</button>
        </div>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px;">
        <button type="button" id="deleteBtn" class="danger" style="display:none; margin-right:auto;" onclick="deleteCurrentQuestion()">Delete Question</button>
        <button type="button" class="secondary" onclick="resetForm()">Clear</button>
        <button type="button" class="success" onclick="saveQuestion()">Save Question</button>
      </div>
    </div>
  </main>

  <script>
    const DB_NAME = 'QuizAppDB';
    const STORE_NAME = 'quizData';
    const RECORD_KEY = 'quiz_bank_v1';

    let questions = [];
    let editingId = null;
    let currentImageBase64 = null;

    // --- IndexedDB Storage Adapter (Replaces localStorage) ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadFromDB() {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(RECORD_KEY);
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        console.warn("IndexedDB failed", e);
        return [];
      }
    }

    async function saveToDB(data) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(data, RECORD_KEY);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function initApp() {
      questions = await loadFromDB();
      updateCategoryDatalist();
      resetForm();
      renderList();
    }

    async function syncStorage() {
      await saveToDB(questions);
      updateCategoryDatalist();
      renderList();
    }

    function updateCategoryDatalist() {
      const categories = [...new Set(questions.map(q => q.category).filter(Boolean))];
      const dl = document.getElementById('categorySuggestions');
      dl.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function addOptionRow(value = '', isChecked = false) {
      const container = document.getElementById('optionsContainer');
      const idx = container.children.length;
      const row = document.createElement('div');
      row.className = 'option-row';
      row.innerHTML = `
        <input type="radio" name="correctOption" ${isChecked ? 'checked' : ''} title="Mark as correct">
        <input type="text" class="rtl-input option-text" placeholder="אפשרות ${idx + 1}" value="${escapeHtml(value)}">
        <button type="button" class="danger" onclick="removeOptionRow(this)" title="Remove option">✕</button>
      `;
      container.appendChild(row);
    }

    function removeOptionRow(btn) {
      const container = document.getElementById('optionsContainer');
      if (container.children.length <= 2) return alert('At least 2 options are required.');
      btn.parentElement.remove();
      const radios = [...container.querySelectorAll('input[type="radio"]')];
      if (!radios.some(r => r.checked) && radios.length > 0) radios[0].checked = true;
    }

    // --- Image Handling ---
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) readImageFile(file);
    }

    function readImageFile(file) {
      if (!file.type.startsWith('image/')) return alert('Please upload a valid image file.');
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageBase64 = e.target.result;
        const img = document.getElementById('imagePreview');
        img.src = currentImageBase64;
        img.style.display = 'block';
        document.getElementById('clearImgBtn').style.display = 'inline-block';
        document.getElementById('dropZone').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      currentImageBase64 = null;
      document.getElementById('imageInput').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('clearImgBtn').style.display = 'none';
      document.getElementById('dropZone').style.display = 'block'; 
    }

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) readImageFile(e.dataTransfer.files[0]);
    });

    window.addEventListener('paste', e => {
      const items = (e.clipboardData || window.clipboardData).items;
      if (!items) return;
      for (let item of items) {
        if (item.type.indexOf('image/') !== -1) {
          const file = item.getAsFile();
          if (file) {
            readImageFile(file);
            e.preventDefault(); 
            break;
          }
        }
      }
    });

    // --- Form Logic ---
    function resetForm() {
      editingId = null;
      document.getElementById('formTitle').textContent = 'Create Question';
      document.getElementById('categoryInput').value = '';
      document.getElementById('questionInput').value = '';
      document.getElementById('explanationInput').value = '';
      document.getElementById('deleteBtn').style.display = 'none';
      clearImage();

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      for (let i = 0; i < 4; i++) addOptionRow('', i === 0);
      renderList();
    }

    async function saveQuestion() {
      const category = document.getElementById('categoryInput').value.trim() || 'Uncategorized';
      const question = document.getElementById('questionInput').value.trim();
      const explanation = document.getElementById('explanationInput').value.trim();

      const rows = [...document.querySelectorAll('#optionsContainer .option-row')];
      const options = [];
      let correctIndex = -1;

      rows.forEach((row) => {
        const text = row.querySelector('.option-text').value.trim();
        const checked = row.querySelector('input[type="radio"]').checked;
        if (text !== '') {
          if (checked) correctIndex = options.length;
          options.push(text);
        }
      });

      if (!question) return alert('Please enter a question.');
      if (options.length < 2) return alert('Please provide at least 2 non-empty answer options.');
      if (correctIndex === -1) return alert('Please mark the correct answer.');

      const payload = {
        id: editingId || ('q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)),
        category,
        question,
        options,
        correctIndex,
        explanation,
        image: currentImageBase64
      };

      if (editingId) {
        const idx = questions.findIndex(q => q.id === editingId);
        if (idx !== -1) questions[idx] = payload;
      } else {
        questions.push(payload);
      }

      await syncStorage();
      resetForm();
    }

    function loadQuestionForEdit(id) {
      const q = questions.find(item => item.id === id);
      if (!q) return;
      editingId = q.id;
      document.getElementById('formTitle').textContent = 'Edit Question';
      document.getElementById('categoryInput').value = q.category || '';
      document.getElementById('questionInput').value = q.question || '';
      document.getElementById('explanationInput').value = q.explanation || '';
      document.getElementById('deleteBtn').style.display = 'inline-block';

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      q.options.forEach((opt, idx) => addOptionRow(opt, idx === q.correctIndex));

      if (q.image) {
        currentImageBase64 = q.image;
        const img = document.getElementById('imagePreview');
        img.src = q.image;
        img.style.display = 'block';
        document.getElementById('clearImgBtn').style.display = 'inline-block';
        document.getElementById('dropZone').style.display = 'none';
      } else {
        clearImage();
      }
      renderList();
    }

    async function deleteCurrentQuestion() {
      if (!editingId) return;
      if (!confirm('Delete this question?')) return;
      questions = questions.filter(q => q.id !== editingId);
      await syncStorage();
      resetForm();
    }

    function renderList() {
      const list = document.getElementById('questionList');
      const filter = document.getElementById('searchFilter').value.toLowerCase();
      document.getElementById('countDisplay').textContent = `${questions.length} questions in bank`;

      const filtered = questions.filter(q =>
        (q.category || '').toLowerCase().includes(filter) ||
        (q.question || '').toLowerCase().includes(filter) ||
        (q.explanation || '').toLowerCase().includes(filter)
      );

      list.innerHTML = filtered.map(q => `
        <div class="q-item ${q.id === editingId ? 'active' : ''}" onclick="loadQuestionForEdit('${q.id}')">
          <div class="q-item-header">
            <span>${escapeHtml(q.category)}</span>
            <span>${q.options.length} opts ${q.image ? '🖼️' : ''}</span>
          </div>
          <div class="q-item-text">${escapeHtml(q.question)}</div>
        </div>
      `).join('');
    }

    function exportJSON() {
      if (questions.length === 0) return alert('No questions to export.');
      const jsonString = JSON.stringify(questions, null, 2);
      const blob = new Blob(["\uFEFF" + jsonString], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `quiz_bank_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const jsonText = e.target.result.replace(/^\uFEFF/, '');
          const imported = JSON.parse(jsonText);
          if (!Array.isArray(imported)) throw new Error('Invalid format');
          const existingIds = new Set(questions.map(q => q.id));
          let updated = 0, added = 0;
          imported.forEach(item => {
            if (!item.question || !Array.isArray(item.options)) return;
            if (!item.id) item.id = 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            if (existingIds.has(item.id)) {
              const idx = questions.findIndex(q => q.id === item.id);
              questions[idx] = item;
              updated++;
            } else {
              questions.push(item);
              added++;
            }
          });
          await syncStorage();
          alert(`Imported: ${added} new, ${updated} updated.`);
        } catch (err) {
          alert('Failed to parse JSON file.');
        }
      };
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    }

    // Initialize App
    initApp();
  </script>
</body>
</html>
